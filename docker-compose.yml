version: "3.8"

services:
  backend:
    build: ./backend
    container_name: tcmp-backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/tcmp.db
      - JWT_SECRET=please-change-me-in-prod
      - EMAIL_DOMAIN_WHITELIST=company.com,example.com
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tcmp-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
